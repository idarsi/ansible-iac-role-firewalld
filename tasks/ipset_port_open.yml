---
###############################################################################
#
# ipset_port_open.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Checking inbound ipset port rules"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --query-rich-rule=rule family="ipv4" source
        ipset='{{ item.0.name }}' port
        port={{ item.1 | split('/') | first }}
        protocol={{ item.1 | split('/') | last }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('in.ports', 'defined') | subelements('in.ports') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: fw_in_port_rule_queries
  changed_when: false
  failed_when: fw_in_port_rule_queries.rc not in [0, 1]

- name: "Checking legacy inbound ipset port rules"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --query-rich-rule=rule source ipset='{{ item.0.name }}' port
        port={{ item.1 | split('/') | first }}
        protocol={{ item.1 | split('/') | last }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('in.ports', 'defined') | subelements('in.ports') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: fw_in_port_legacy_rule_queries
  changed_when: false
  failed_when: fw_in_port_legacy_rule_queries.rc not in [0, 1]

- name: "Ensuring inbound ipset port rules are open"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --add-rich-rule=rule family="ipv4" source
        ipset='{{ item.0.name }}' port
        port={{ item.1 | split('/') | first }}
        protocol={{ item.1 | split('/') | last }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('in.ports', 'defined') | subelements('in.ports') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  when:
    - fw_in_port_rule_queries.results[ansible_loop.index0].rc == 1
    - fw_in_port_legacy_rule_queries.results[ansible_loop.index0].rc == 1
  register: fw_in_port_rule_additions
  changed_when: fw_in_port_rule_additions.rc == 0

- name: "Checking outbound ipset port rules"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --query-rich-rule=rule family="ipv4" destination ipset='{{ item.0.name }}' port
        port={{ item.1 | split('/') | first }}
        protocol={{ item.1 | split('/') | last }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('out.ports', 'defined') | subelements('out.ports') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: fw_out_port_rule_queries
  changed_when: false
  failed_when: fw_out_port_rule_queries.rc not in [0, 1]

- name: "Ensuring outbound ipset port rules are open"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --add-rich-rule=rule family="ipv4" destination ipset='{{ item.0.name }}' port
        port={{ item.1 | split('/') | first }}
        protocol={{ item.1 | split('/') | last }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('out.ports', 'defined') | subelements('out.ports') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  when: fw_out_port_rule_queries.results[ansible_loop.index0].rc == 1
  register: fw_out_port_rule_additions
  changed_when: fw_out_port_rule_additions.rc == 0
