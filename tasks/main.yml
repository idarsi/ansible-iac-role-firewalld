---
###############################################################################
#
# main.yml
#
# @author Arsi Atomi
#
###############################################################################

###############################################################################
# CHECKING REQUIREMENTS
###############################################################################

- name: "Checking if operating system is supported"
  ansible.builtin.fail:
    msg: "Unsupported operating system: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}"
  when: >
    iac_supported_os | selectattr('name', 'equalto', ansible_facts['distribution'])
                     | selectattr('versions', 'contains', ansible_facts['distribution_major_version'])
                     | list
                     | length == 0

###############################################################################
# CHECKING BLUEPRINT EXECUTION CONTEXT
###############################################################################

- name: "Checking firewalld blueprint execution context"
  ansible.builtin.assert:
    that:
      - iac_blueprint is defined
    fail_msg: "iac_blueprint is not defined"

- name: "Checking firewalld blueprint root type"
  ansible.builtin.assert:
    that:
      - iac_blueprint | type_debug == "dict"
    fail_msg: "iac_blueprint must be a mapping containing firewalld"

- name: "Checking firewalld service blueprint"
  ansible.builtin.assert:
    that:
      - iac_blueprint.firewalld is defined
    fail_msg: "iac_blueprint.firewalld is not defined"

###############################################################################
# NORMALIZING STATE AND VALIDATING BLUEPRINT
###############################################################################

- name: "Setting requested IaC state"
  ansible.builtin.set_fact:
    iac_state: "{{ state | default('install') }}"

- name: "Validating firewalld inventory"
  ansible.builtin.include_tasks: validate/validate_inventory.yml

- name: "Normalizing firewalld ipsets"
  ansible.builtin.set_fact:
    fw_ipsets: "{{ iac_blueprint.firewalld.ipsets | default([]) }}"

###############################################################################
# DISPATCHING STATES
###############################################################################

- name: "STATE: Validate firewalld blueprint"
  ansible.builtin.debug:
    msg: "The firewalld blueprint is valid"
  when: iac_state == "validate"

- name: "STATE: Install and configure firewalld"
  ansible.builtin.include_tasks: install.yml
  when: iac_state == "install"

- name: "STATE: Ensure firewalld is present"
  ansible.builtin.include_tasks: present.yml
  when: iac_state == "present"

- name: "STATE: Ensure firewalld is absent"
  ansible.builtin.include_tasks: absent.yml
  when: iac_state == "absent"

- name: "STATE: Ensure firewalld is started"
  ansible.builtin.include_tasks: started.yml
  when: iac_state == "started"

- name: "STATE: Ensure firewalld is stopped"
  ansible.builtin.include_tasks: stopped.yml
  when: iac_state == "stopped"

- name: "STATE: Open firewalld port"
  ansible.builtin.include_tasks: port_open.yml
  when: iac_state == "port_open"

- name: "STATE: Close firewalld port"
  ansible.builtin.include_tasks: port_closed.yml
  when: iac_state == "port_closed"

- name: "STATE: Open firewalld service"
  ansible.builtin.include_tasks: service_open.yml
  when: iac_state == "service_open"

- name: "STATE: Close firewalld service"
  ansible.builtin.include_tasks: service_closed.yml
  when: iac_state == "service_closed"

- name: "STATE: Ensure firewalld ipsets are present"
  ansible.builtin.include_tasks: ipset_present.yml
  when: iac_state == "ipset_present"

- name: "STATE: Ensure firewalld ipsets are absent"
  ansible.builtin.include_tasks: ipset_absent.yml
  when: iac_state == "ipset_absent"

- name: "STATE: Ensure ipset entries are present"
  ansible.builtin.include_tasks: ipset_ip_present.yml
  when: iac_state == "ipset_ip_present"

- name: "STATE: Ensure ipset entries are absent"
  ansible.builtin.include_tasks: ipset_ip_absent.yml
  when: iac_state == "ipset_ip_absent"

- name: "STATE: Open ipset rich-rule ports"
  ansible.builtin.include_tasks: ipset_port_open.yml
  when: iac_state == "ipset_port_open"

- name: "STATE: Close ipset rich-rule ports"
  ansible.builtin.include_tasks: ipset_port_closed.yml
  when: iac_state == "ipset_port_closed"

- name: "STATE: Open ipset rich-rule services"
  ansible.builtin.include_tasks: ipset_service_open.yml
  when: iac_state == "ipset_service_open"

- name: "STATE: Close ipset rich-rule services"
  ansible.builtin.include_tasks: ipset_service_closed.yml
  when: iac_state == "ipset_service_closed"

- name: "STATE: Reload firewalld"
  ansible.builtin.include_tasks: reloaded.yml
  when: iac_state == "reloaded"
