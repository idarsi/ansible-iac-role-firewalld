###############################################################################
#
# service_closed.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Checking whether service is open"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--permanent"
      - "--zone={{ fw_zone }}"
      - "--query-service={{ fw_service }}"
  register: fw_service_query
  changed_when: false
  failed_when: fw_service_query.rc not in [0, 1]

- name: "Ensuring service is closed"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--permanent"
      - "--zone={{ fw_zone }}"
      - "--remove-service={{ fw_service }}"
  register: fw_command
  changed_when: true
  when: fw_service_query.rc == 0
