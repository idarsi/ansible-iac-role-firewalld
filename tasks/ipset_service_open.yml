---
###############################################################################
#
# ipset_service_open.yml
#
# @author Arsi Atomi
#
###############################################################################

- name: "Checking inbound ipset service rules"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --query-rich-rule=rule family="ipv4" source
        ipset='{{ item.0.name }}' service name={{ item.1 }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('in.services', 'defined') | subelements('in.services') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: fw_in_service_rule_queries
  changed_when: false
  failed_when: fw_in_service_rule_queries.rc not in [0, 1]

- name: "Checking legacy inbound ipset service rules"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --query-rich-rule=rule source ipset='{{ item.0.name }}'
        service name={{ item.1 }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('in.services', 'defined') | subelements('in.services') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: fw_in_service_legacy_rule_queries
  changed_when: false
  failed_when: fw_in_service_legacy_rule_queries.rc not in [0, 1]

- name: "Ensuring inbound ipset service rules are open"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --add-rich-rule=rule family="ipv4" source
        ipset='{{ item.0.name }}' service name={{ item.1 }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('in.services', 'defined') | subelements('in.services') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  when:
    - fw_in_service_rule_queries.results[ansible_loop.index0].rc == 1
    - fw_in_service_legacy_rule_queries.results[ansible_loop.index0].rc == 1
  register: fw_in_service_rule_additions
  changed_when: fw_in_service_rule_additions.rc == 0

- name: "Checking outbound ipset service rules"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --query-rich-rule=rule family="ipv4" destination
        ipset='{{ item.0.name }}' service name={{ item.1 }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('out.services', 'defined') | subelements('out.services') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  register: fw_out_service_rule_queries
  changed_when: false
  failed_when: fw_out_service_rule_queries.rc not in [0, 1]

- name: "Ensuring outbound ipset service rules are open"
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - >-
        --add-rich-rule=rule family="ipv4" destination
        ipset='{{ item.0.name }}' service name={{ item.1 }} accept
      - --permanent
      - "--zone={{ fw_zone }}"
  loop: "{{ fw_ipsets | selectattr('out.services', 'defined') | subelements('out.services') }}"
  loop_control:
    extended: true
    label: "{{ item.0.name }}:{{ item.1 }}"
  when: fw_out_service_rule_queries.results[ansible_loop.index0].rc == 1
  register: fw_out_service_rule_additions
  changed_when: fw_out_service_rule_additions.rc == 0
