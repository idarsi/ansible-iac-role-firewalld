name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks (Ansible Core 2.20.8)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Ansible Lint and Ansible Core
        run: python -m pip install -r requirements-ci.txt "ansible-core==2.20.8"

      - name: Run production-profile Ansible Lint
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-lint --profile production

      - name: Run Molecule playbook syntax check
        env:
          ANSIBLE_ROLES_PATH: ..
        run: ansible-playbook --syntax-check molecule/kvm_states/converge.yml
